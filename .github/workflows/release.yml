# Publishes a release when a version tag is pushed.
#
# The tag must match the version in pyproject.toml, and CHANGELOG.md must
# have a section for it. Otherwise nothing is released, and the tag can be
# deleted and pushed again after the fix.
#
# PyPI accepts the upload through trusted publishing, configured on PyPI for
# this workflow and the pypi environment, so no API token is stored here.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=pyproject.toml::The tag is $GITHUB_REF_NAME, but pyproject.toml says version $version."
            exit 1
          fi
      - name: Read the release notes from the changelog
        run: |
          mkdir notes
          awk -v tag="$GITHUB_REF_NAME" '/^## /{ if (found) exit; found = ($2 == tag); next } found' CHANGELOG.md \
            | sed '/./,$!d' > notes/notes.md
          if [ ! -s notes/notes.md ]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no section for $GITHUB_REF_NAME."
            exit 1
          fi
      - name: Run the tests
        run: python -m unittest
      - name: Build the package
        run: |
          python -m pip install -q build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/migcheck/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file artifacts/notes/notes.md artifacts/dist/*
      # Action users pin the major version, such as v0.
      - name: Move the major version tag
        run: |
          major=${GITHUB_REF_NAME%%.*}
          git tag -f "$major"
          git push -f origin "refs/tags/$major"
