[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "migcheck"
version = "0.1.1"
description = "Checks that a release's database migrations don't break the release running in production."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
migcheck = "migcheck.__main__:main"

[project.urls]
Repository = "https://github.com/Genetic-Pottery/migcheck"

[tool.setuptools]
packages = ["migcheck"]
